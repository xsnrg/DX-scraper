# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        playwright install chromium
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run unit tests
      run: |
        pytest -m "not acceptance"
      env:
        PYTHONPATH: .
    - name: Start FastAPI server
      run: |
        uvicorn src.api:app --host 0.0.0.0 --port 8000 &
        ready=0
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:8000/ >/dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" != 1 ]; then
          echo "Server did not become ready" >&2
          exit 1
        fi
    - name: Run acceptance tests
      run: |
        pytest -m acceptance
      env:
        PYTHONPATH: .
    - name: Stop FastAPI server
      if: always()
      run: kill %1 2>/dev/null || true
