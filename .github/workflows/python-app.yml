# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        playwright install chromium
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Start FastAPI server
      run: |
        uvicorn src.api:app --host 0.0.0.0 --port 8000 &
        sleep 3
    - name: Run acceptance tests
      run: |
        pytest tests/test_api.py tests/test_column_filter.py tests/test_dashboard.py tests/test_data_table.py tests/test_map.py tests/test_pagination.py tests/test_pota.py tests/test_qrz.py tests/test_responsive.py tests/test_search.py tests/test_sorting.py tests/test_spot_age.py tests/test_wanted.py
      env:
        PYTHONPATH: .
    - name: Stop FastAPI server
      if: always()
      run: kill %1 2>/dev/null || true
    - name: Run unit tests
      run: |
        pytest --ignore=tests/test_acceptance.py
      env:
        PYTHONPATH: .
