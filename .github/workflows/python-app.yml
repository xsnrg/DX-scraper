# Install Python deps, lint, and run unit + acceptance tests on Linux and Windows.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      PYTHONPATH: .

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        python -m pip install -r requirements.txt
        python -m playwright install chromium

    - name: Lint with flake8
      id: lint
      run: |
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run unit tests
      run: python -m pytest -m "not acceptance"

    - name: Start FastAPI server (Linux)
      if: runner.os == 'Linux' && always() && steps.lint.outcome == 'success'
      run: |
        python -m uvicorn src.api:app --host 0.0.0.0 --port 8000 &
        ready=0
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:8000/ >/dev/null; then
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" != 1 ]; then
          echo "Server did not become ready" >&2
          exit 1
        fi

    - name: Run acceptance tests (Linux)
      if: runner.os == 'Linux' && always() && steps.lint.outcome == 'success'
      run: python -m pytest -m acceptance

    - name: Stop FastAPI server (Linux)
      if: always() && runner.os == 'Linux'
      run: kill %1 2>/dev/null || pkill -f "uvicorn src.api:app" || true

    # Windows runners tear down Start-Process children at step end, so the
    # server and Playwright must share one step. Chromium resolves localhost
    # to ::1, so uvicorn listens on IPv6.
    - name: Run acceptance tests (Windows)
      if: runner.os == 'Windows' && always() && steps.lint.outcome == 'success'
      shell: pwsh
      run: |
        $python = (Get-Command python).Source
        $ws = (Get-Location).Path
        $proc = Start-Process -PassThru -WindowStyle Hidden `
          -FilePath $python `
          -WorkingDirectory $ws `
          -ArgumentList @("-m","uvicorn","src.api:app","--host","::","--port","8000") `
          -RedirectStandardOutput (Join-Path $ws "uvicorn.out") `
          -RedirectStandardError (Join-Path $ws "uvicorn.err")
        $ready = $false
        $urls = @("http://localhost:8000/", "http://[::1]:8000/")
        for ($i = 0; $i -lt 30; $i++) {
          foreach ($url in $urls) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -ge 200) {
                Write-Host "Server ready at $url"
                $ready = $true
                break
              }
            } catch {}
          }
          if ($ready) { break }
          Start-Sleep -Seconds 1
        }
        if (-not $ready) {
          Write-Host "--- uvicorn.out ---"
          if (Test-Path (Join-Path $ws "uvicorn.out")) { Get-Content (Join-Path $ws "uvicorn.out") }
          Write-Host "--- uvicorn.err ---"
          if (Test-Path (Join-Path $ws "uvicorn.err")) { Get-Content (Join-Path $ws "uvicorn.err") }
          throw "Server did not become ready"
        }
        try {
          python -m pytest -m acceptance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" |
            Where-Object { $_.CommandLine -match 'uvicorn src.api:app' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
        }
