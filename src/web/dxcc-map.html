    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #map { width: 100vw; height: 100vh; }
        .legend {
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            line-height: 1.6;
        }
        .legend h4 { margin: 0 0 8px 0; font-size: 14px; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .country-list {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 300px;
            max-height: 80vh;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
            overflow: hidden;
        }
        .country-list-header {
            padding: 12px 16px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            font-weight: 600;
        }
        .country-list-content {
            max-height: calc(80vh - 45px);
            overflow-y: auto;
            padding: 8px 0;
        }
        .country-item {
            padding: 6px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .country-item:hover { background: #f8f9fa; }
        .country-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .search-box {
            width: calc(100% - 16px);
            margin: 8px 8px;
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 13px;
        }
        .search-box:focus { outline: none; border-color: #007bff; }
        .stats {
            padding: 8px 16px;
            border-top: 1px solid #dee2e6;
            font-size: 12px;
            color: #6c757d;
        }
    </style>
</head>

        // Initialize map
        const map = L.map('map').setView([20, 0], 2);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Initialize map
        let qslData = {};
        let countryLayers = {};
        let allCountries = [];

        // Fetch QSO data from API
        async function fetchQSOData() {
            try {
                const response = await fetch('/qrz-qso-data');
                const data = await response.json();
                
                // Process QSO data to get QSL status per country
                if (data.data && Array.isArray(data.data)) {
                    data.data.forEach(qso => {
                        const country = qso.country || '';
                        const status = (qso.app_qrzlog_status || '').toUpperCase();
                        
                        if (!qslData[country]) {
                            qslData[country] = { status: 'none', qsl: '' };
                        }
                        
                        // Update status based on QRZ confirmation
                        if (status === 'C') {
                            qslData[country].status = 'confirmed';
                            qslData[country].qsl = status;
                        } else if (status === 'N') {
                            if (qslData[country].status !== 'confirmed') {
                                qslData[country].status = 'logged';
                                qslData[country].qsl = status;
                            }
                        } else if (status) {
                            // Any other non-empty value means logged
                            if (qslData[country].status === 'none') {
                                qslData[country].status = 'logged';
                                qslData[country].qsl = status;
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('Error fetching QSO data:', error);
            }
        }

        // Get color for country based on QSL status
        function getCountryColor(countryName) {
            const data = qslData[countryName];
            if (!data || data.status === 'none') {
                return '#cccccc'; // Grey - not in cache
            } else if (data.status === 'confirmed') {
                return '#4caf50'; // Green - confirmed
            } else {
                return '#ffeb3b'; // Yellow - logged but not verified
            }
        }

        // Add countries to map
        function addCountriesToMap() {
            // Remove existing layers
            Object.values(countryLayers).forEach(layer => map.removeLayer(layer));
            countryLayers = {};
            
            // Add each country as a circle marker
            allCountries.forEach(country => {
                const color = getCountryColor(country.name);
                const layer = L.circleMarker(country.center, {
                    radius: 6,
                    fillColor: color,
                    color: '#333',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map);
                
                layer.bindTooltip(`${country.name} (DXCC: ${country.dxcc})<br>Status: ${qslData[country.name]?.status || 'none'}`, {
                    permanent: false,
                    direction: 'top',
                    className: 'country-tooltip'
                });
                
                countryLayers[country.name] = layer;
            });
        }

        // Update country list
        function updateCountryList(filter = '') {
            const listElement = document.getElementById('countryList');
            const statsElement = document.getElementById('stats');
            
            const filtered = allCountries.filter(c => 
                c.name.toLowerCase().includes(filter.toLowerCase())
            );
            
            // Sort by status: confirmed first, then logged, then none
            const statusOrder = { 'confirmed': 0, 'logged': 1, 'none': 2 };
            filtered.sort((a, b) => {
                const statusA = qslData[a.name]?.status || 'none';
                const statusB = qslData[b.name]?.status || 'none';
                return statusOrder[statusA] - statusOrder[statusB];
            });
            
            listElement.innerHTML = filtered.map(country => {
                const status = qslData[country.name]?.status || 'none';
                const color = getCountryColor(country.name);
                return `
                    <div class="country-item" onclick="focusCountry('${country.name}')">
                        <div class="country-dot" style="background: ${color}"></div>
                        <span>${country.name}</span>
                        <span style="margin-left: auto; font-size: 11px; color: #666;">${status}</span>
                    </div>
                `;
            }).join('');
            
            // Update stats
            const confirmed = Object.values(qslData).filter(d => d.status === 'confirmed').length;
            const logged = Object.values(qslData).filter(d => d.status === 'logged').length;
            const none = Object.values(qslData).filter(d => d.status === 'none').length;
            statsElement.innerHTML = `
                <div>Confirmed: ${confirmed}</div>
                <div>Logged: ${logged}</div>
                <div>Not in cache: ${none}</div>
                <div>Total DXCC: ${allCountries.length}</div>
            `;
        }

        // Focus on country when clicked in list
        function focusCountry(countryName) {
            const country = allCountries.find(c => c.name === countryName);
            if (country) {
                map.setView(country.center, 4);
                const layer = countryLayers[countryName];
                if (layer) {
                    layer.setRadius(10);
                    setTimeout(() => layer.setRadius(6), 2000);
                }
            }
        }

        // Search functionality
        document.getElementById('search').addEventListener('input', (e) => {
            updateCountryList(e.target.value);
        });

        // Add legend
        const legend = L.control({position: 'bottomleft'});
        legend.onAdd = function() {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>DXCC QSL Status</h4>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4caf50"></div>
                    <span>Confirmed (2-way QSL)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffeb3b"></div>
                    <span>Logged (not verified)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #cccccc"></div>
                    <span>Not in cache</span>
                </div>
            `;
            return div;
        };
        legend.addTo(map);

        // Initialize
        async function init() {
            allCountries = [...new Map(DXCC_COUNTRIES.map(item => [item.dxcc, item])).values()];
            await fetchQSOData();
            addCountriesToMap();
            updateCountryList();
        }

        init();
    </script>
</body>
</html>
